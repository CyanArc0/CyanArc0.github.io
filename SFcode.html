<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烧风关卡码</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-hover: rgba(51, 65, 85, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #34d399;
            --accent-purple: #a78bfa;
            --accent-orange: #fb923c;
            --glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(167, 139, 250, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--accent-cyan);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* 顶部统计栏 */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 1rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-orange);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 0.2rem;
        }

        /* 卡片网格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .level-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .level-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-purple));
            opacity: 0.6;
            transition: opacity 0.25s ease;
        }

        .level-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 15px var(--glow);
        }

        .level-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .level-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            /*
            background: rgba(255, 255, 255, 0.06);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            */
            white-space: nowrap;
            flex-shrink: 0;
        }

        .time-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--accent-green);
            background: rgba(52, 211, 153, 0.1);
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            max-width: 50%;
            text-align: right;
        }

        .time-badge::after {
            content: '⚡';
            font-size: 0.8rem;
        }

        .link-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .link-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .copy-btn {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 6px;
            padding: 0.35rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .copy-btn.copied {
            background: var(--accent-green);
            color: var(--bg-color);
            border-color: var(--accent-green);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            background: var(--accent-green);
            color: var(--bg-color);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            body { padding: 1rem 0.75rem; }
            .grid-container { grid-template-columns: 1fr; }
            .stats-bar { gap: 1rem; padding: 0.75rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>烧风关卡码</h1>
            <p>青弧Cyan_arc的关卡码分享</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="level-count">20/25</div>
                <div class="stat-label">通关总数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-time">213.6s</div>
                <div class="stat-label">累计用时</div>
            </div>
        </div>

        <div class="grid-container" id="levels-grid"></div>
    </div>

    <div class="toast" id="toast">已复制关卡码！</div>

    <script>
        // 20关数据列表 (可在下方的 JS 数组中修改真实的用时与解法代码)
        const levelData = [
            { name: "01 - 落羽", time: "9.1s", code: "luo-yu:12.7,6.2,c_16.4,14.6,c_23.3,22.7,c_17.8,45.2,h_23.5,39.3,h" },
            { name: "02 - 扶摇", time: "6.1s", code: "fu-yao:11.78,36.74,h_14.94,36.19,h_23.23,23.1,h_17.6,9.94,c_22.75,17.96,c_17.92,28.41,h" },
            { name: "03 - 信风", time: "5.2s", code: "xin-feng:10.7,15.5,c_14.3,25.15,h_14.3,13.65,c_10.7,23.1,h_13.22,28.83,h" },
            { name: "04 - 潮汐", time: "14.0s", code: "chao-xi:23.77,33.96,h_27.08,33.89,h_59.25,18.73,c_57.53,12.11,c" },
            { name: "05 - 回归", time: "8.1 + 0.2 = 8.3s", code: "hui-gui:10.96,29.3,h_14.9,26.55,h_7.28,14.02,c_17.01,21.82,h_15.95,17.09,c" },
            { name: "06 - 营火", time: "5.5s", code: "ying-huo:19.65,8.98,c_19.79,12.79,h_15.92,15.39,h" },
            { name: "07 - 冰窖", time: "9.1s", code: "bing-jiao:16.98,14.15,c_18.87,21.68,h_66.56,18.8,c" },
            { name: "08 - 鼓风", time: "7.7s", code: "gu-feng:21.63,13.56,c_21.69,17.49,h_17.37,20.63,h" },
            { name: "09 - 钟摆", time: "7.7s", code: "zhong-bai:21.3,19.78,h_26.41,7.34,h_26.8,3.93,c" },
            { name: "10 - 焚风", time: "9.8 + 0.1 = 9.9s", code: "fen-feng:19.2,17.36,h_19.73,13.03,c_48.09,8.12,h" },
            { name: "11 - 初霜", time: "6.7s", code: "chu-shuang:12.12,36.81,h_16.17,30.16,h_22,22,h_21.6,17.82,c" },
            { name: "12 - 逆旅", time: "6.9s", code: "ni-lu:14.01,14.27,c_16.5,16.39,c_14.45,23.33,h_16.54,20.24,h_18.51,23.28,h" },
            { name: "13 - 疾摆", time: "9.7s", code: "ji-bai:19.35,22.16,h_25.46,17.31,h" },
            { name: "14 - 灼原", time: "16.2s", code: "zhuo-yuan:61.54,25.05,c_42.5,15.3,h" },
            { name: "15 - 天堑", time: "24.8 + 0.7 = 25.5s", code: "tian-qian:63.29,7.46,c_49.12,23.3,h_35.11,42.76,h" },
            { name: "16 - 坠星", time: "7.3s", code: "zhui-xing:13.23,42.5,h_13.18,45.7,h_16.8,29.26,h_16.9,21.87,c" },
            { name: "17 - 回音", time: "13.4s", code: "hui-yin:21.45,7.22,c_20.93,20.96,h_17.11,33.9,h_80.8,27.2,c_92.4,39.9,h" },
            { name: "18 - 天梯", time: "8.3s", code: "tian-ti:22.7,10.9,c_25.5,17.1,c_12.8,50.8,h_15,45.2,h_25.65,23.3,h_22.04,29.3,h" },
            { name: "19 - 穿堂", time: "16.4s", code: "chuan-tang:18.77,35.95,h_17.09,15.98,c_18.86,22.02,h_65.31,43.2,c_65.68,53.51,h" },
            { name: "20 - 归墟", time: "18.9 + 1.7 = 20.6s", code: "gui-xu:17,30.28,h_17.65,19.23,h_17.47,3.06,c_100.06,28.24,h_101.57,31.71,c_102.57,13.19,c_102.66,9.84,h" }
        ];

        function renderLevels() {
            const grid = document.getElementById('levels-grid');
            let totalTime = 0;
            let minTime = Infinity;

            levelData.forEach(item => {
                totalTime += item.time;
                if (item.time < minTime) minTime = item.time;

                const card = document.createElement('div');
                card.className = 'level-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="level-badge">
                            <span class="level-name">${item.name}</span>
                        </div>
                        <div class="time-badge">${item.time}</div>
                    </div>
                    <div class="link-box">
                        <span class="link-text" title="${item.code}">${item.code}</span>
                        <button class="copy-btn" onclick="copyCode(this, '${item.code}')">复制</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function copyCode(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                showToast();

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', renderLevels);
    </script>
</body>
</html>
